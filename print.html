<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio PDF Generator — FAIZ AKBARSYAH®</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="print-body">

  <!-- Controls Header (Disembunyikan Otomatis saat Di-print/Save PDF) -->
  <header class="print-controls-header no-print">
    <div class="print-controls-left">
      <a href="/" class="brand-logo">← BACK TO WEBSITE</a>
      <span class="print-separator">|</span>
      <span class="print-title">PORTFOLIO PDF GENERATOR</span>
    </div>
    
    <div class="print-controls-right">
      <label for="categorySelect" class="print-label">Filter Kategori:</label>
      <select id="categorySelect" class="print-select"></select>
      
      <!-- Tombol Aksi Download PDF Utama Ber-Ikon & Mencolok -->
      <button onclick="window.print()" class="btn-print-action">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Save as PDF / Print</span>
      </button>
    </div>
  </header>

  <!-- Dokumen Cetak / Editorial Layout -->
  <main class="print-document">
    <header class="print-doc-header">
      <div>
        <h1 class="font-serif print-doc-title">FAIZ AKBARSYAH®</h1>
        <p class="print-doc-subtitle">Graphic Designer — Motion Designer — Creative Director</p>
      </div>
      <div class="print-doc-meta">
        <span id="printCategoryLabel" class="print-tag">ALL CATEGORIES</span>
        <span class="print-date">SELECTED WORKS 2026</span>
      </div>
    </header>

    <div id="printGallery" class="print-gallery-grid"></div>

    <footer class="print-doc-footer">
      <span>FAIZ AKBARSYAH® PORTFOLIO SHOWCASE</span>
      <span>CONTACT@FAIZAKBARSYAH.COM — MEDAN, INDONESIA</span>
    </footer>
  </main>

  <script src="/data/site-config.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
