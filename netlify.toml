[build]
  publish = "."

# --------------------------------------------------------------------------
# Pretty project URLs
# /projects/<slug> -> /project.html?slug=<slug>
# --------------------------------------------------------------------------
[[redirects]]
  from = "/projects/*"
  to = "/project.html?slug=:splat"
  status = 200

# --------------------------------------------------------------------------
# Protect internal build tools
#
# File di /tools hanya untuk workflow development lokal dan tidak boleh
# diakses sebagai static asset dari website production.
#
# status = 404:
#   request dianggap "Not Found"
#
# force = true:
#   rule tetap berlaku walaupun file/path tersebut benar-benar ada di repo.
#
# Untuk sementara target diarahkan ke index.html dengan status 404.
# Nanti pada P2, target ini bisa diganti ke 404.html custom Swiss Editorial.
# --------------------------------------------------------------------------
[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404
  force = true

# --------------------------------------------------------------------------
# Cache-Control Strategy
#
# Nama file proyek belum menggunakan hash/versioning
# (mis. style.css, app.js, hero-cover.webp), sehingga browser harus
# mengecek kembali ke server pada setiap kunjungan.
#
# Netlify tetap bisa memakai ETag untuk response ringan ketika asset tidak
# berubah.
# --------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"

# --------------------------------------------------------------------------
# Global Security Headers
# --------------------------------------------------------------------------
[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"
      X-XSS-Protection = "1; mode=block"