[build]
  publish = "."

[[redirects]]
  from = "/projects/*"
  to = "/project.html?slug=:splat"
  status = 200

# --------------------------------------------------------------------------
# Cache-Control Strategy
# Nama file di proyek ini TIDAK memakai hash/versi (mis. style.css, hero-cover.webp),
# jadi browser WAJIB mengecek ulang ke server setiap kali halaman dibuka.
# Netlify mengirim ETag otomatis: kalau file tidak berubah, server hanya membalas
# "304 Not Modified" (sangat ringan, tanpa download ulang). Kalau file berubah
# setelah deploy baru, browser langsung mendapat versi terbaru.
# (Sebelumnya: CSS/JS di-cache 7 hari & assets 1 tahun "immutable" → penyebab
#  tampilan deploy tertinggal dari Live Server.)
# --------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"

# Global Security Headers
[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"
      X-XSS-Protection = "1; mode=block"
