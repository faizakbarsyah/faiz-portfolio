<!DOCTYPE html>
<html lang="id">

  >

    rel="stylesheet"
    href="/css/style.css"

<body>

  <a

    Lompat ke Konten Utama
  </a>


  <!-- ================================================================
       HEADER
       ================================================================ -->

  <header
    class="site-header"
    role="banner"
  >

    <div class="header-inner">

      <a
        href="/"
        class="site-logo"
        aria-label="Beranda FAIZ AKBARSYAH"
      >
        FAIZ AKBARSYAH®
      </a>


      <button
        id="navToggleBtn"
        class="nav-toggle"

        aria-controls="mainNav"
      >
        <span></span>
      </button>


      <nav
        id="mainNav"
        class="main-nav"
        aria-label="Navigasi Utama"
      >

        <a href="/">

        </a>

        <a href="/client.html">
          Clients
        </a>

        <a href="/about.html">
          About
        </a>

        <a href="/services.html">
          Services
        </a>

        <a href="/#contact">
          Contact
        </a>

      </nav>

    </div>

  </header>


  <!-- ================================================================
       PROJECT CONTENT
       ================================================================ -->

  <main
    id="main-content"
    role="main"
  >

    <div
      id="projectContainer"
      class="project-page"
    >

      <div
        class="clients-loading"
        aria-live="polite"
      >
        Loading project…
      </div>

    </div>

  </main>


  <!-- ================================================================

       ================================================================ -->

  <footer
    class="site-footer"
    role="contentinfo"
  >

    <div class="footer-main">

      <div class="footer-brand">

        <strong>
          FAIZ AKBARSYAH®
        </strong>

        <p>
          Graphic Designer, Motion Designer & Creative Director.
        </p>

      </div>


      <div class="footer-links">

        <a href="/">
          Work
        </a>

        <a href="/client.html">

        <a href="/about.html">

        </a>

        <a href="/services.html">
          Services
        </a>

        <a href="/#contact">

        </a>

      </span>

        MEDAN, INDONESIA
      </span>
